<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brownie AC</title>
<meta name="theme-color" content="#170708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brownie AC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular em coluna única — cabeçalho com a logo, conteúdo por aba e barra inferior fixa com botão central de lançamento */
:root{
  --bg:#170708; --surface:#241010; --surface-2:#301615; --line:#4A2622;
  --fg:#F6E7D4; --muted:#C2A388; --gold:#D9A955; --gold-hi:#F2CF86; --gold-ink:#2A0E0C;
  --good:#86CFA0; --good-soft:#1F3226; --warn:#E9B451; --warn-soft:#3B2A12; --bad:#F08473; --bad-soft:#3E1A16;
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(120% 60% at 50% -10%,#3a1214 0%,transparent 60%)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:10px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.head{display:flex;align-items:center;gap:12px}
.head img{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:0 0 0 1px #6b3b22,0 6px 16px rgb(0 0 0/.45)}
.head .ttl{flex:1;min-width:0}
.head h1{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em;color:var(--gold-hi);line-height:1.1}
.head small{display:block;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:1.1rem;color:var(--gold)}
.month span{min-width:74px;text-align:center;font-weight:700;font-size:.85rem;text-transform:capitalize}

.eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec-title{font-family:var(--f-display);font-size:1.25rem;color:var(--gold-hi)}

.hero{border-radius:20px;padding:16px;background:linear-gradient(160deg,#3B1416 0%,#241010 70%);border:1px solid #5a2c22;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:6px;border:1px dashed rgb(217 169 85/.28);border-radius:15px;pointer-events:none}
.hero .big{font-family:var(--f-display);font-size:2.3rem;line-height:1;color:var(--gold-hi)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:rgb(0 0 0/.22);border-radius:12px;padding:9px 11px;min-width:0}
.kpi span{display:block;font-size:.72rem;color:var(--muted)}
.kpi b{display:block;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--good)} .neg{color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.card-h em{font-style:normal;font-size:.78rem;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.88rem}
.bar-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-row .vl{font-weight:700;text-align:right}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,#9c6a2a,var(--gold-hi));border-radius:99px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:var(--fg)}
.row:last-child{border-bottom:0}
.row .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:800;text-align:right}
.row .m{font-size:.78rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{text-align:right}
.chip{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap;border:0}
.chip.ok{background:var(--good-soft);color:var(--good)} .chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.buy{background:#2c1d33;color:#d2b4f0}
.empty{color:var(--muted);font-size:.9rem;padding:12px 2px}

.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:320px}
th{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;color:var(--gold-hi);border-top:1px solid var(--gold);border-bottom:0}

.dist{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left;color:var(--fg)}
.dist+.dist{margin-top:8px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid #6b3b22;color:var(--gold-hi);font-family:var(--f-display);font-size:1.1rem}
.dist .t{font-weight:800}
.dist .m{font-size:.78rem;color:var(--muted)}
.dist .v{text-align:right;font-weight:800}
.dist .v small{display:block;font-weight:700;font-size:.72rem}

.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-weight:700;color:var(--fg)}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-color:var(--gold)}
.btn.ghost{background:none;border-style:dashed;color:var(--gold-hi);width:100%}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#2a0c08;border-color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgb(23 7 8/.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:700;padding:6px 0}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--gold-hi)}
.nav .plus{align-self:center}
.nav .plus span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);font-size:1.8rem;line-height:1;box-shadow:0 6px 18px rgb(0 0 0/.5),0 0 0 4px var(--bg);margin-top:-22px}

/* folhas (sheets) */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0/.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;border-top:1px solid #6b3b22;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:94%;overflow:auto;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 2px}
.sheet h2{font-family:var(--f-display);font-size:1.35rem;color:var(--gold-hi)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;font-size:16px;min-width:0}
input::placeholder{color:#7d6252}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 78px 92px;gap:6px;align-items:center}
.ln .nm{font-weight:700;font-size:.9rem;min-width:0}
.ln .nm small{display:block;color:var(--muted);font-weight:600;font-size:.72rem}
.ln input{padding:9px 8px;text-align:right}
.ln.on .nm{color:var(--gold-hi)}
.ln-h{display:grid;grid-template-columns:minmax(0,1fr) 78px 92px;gap:6px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.ln-h span{text-align:right}
.grp{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.total b{font-family:var(--f-display);font-size:1.5rem;color:var(--gold-hi)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.err{color:var(--bad);font-size:.85rem}
.edit-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 38px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.edit-row input{padding:9px 10px}
.edit-row .val{text-align:right}
.x{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:1.2rem}
.x.armed{background:var(--bad-soft);color:var(--bad)}
.hint{font-size:.78rem;color:var(--muted);margin:6px 0 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats3 div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.stats3 span{display:block;font-size:.68rem;color:var(--muted)}
.stats3 b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold-hi);color:var(--gold-ink);padding:9px 16px;border-radius:99px;font-size:.88rem;font-weight:800;z-index:30;box-shadow:0 6px 18px rgb(0 0 0/.4)}
.choose{display:grid;gap:8px}
.choose button{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.choose b{display:block}
.choose small{color:var(--muted)}
.choose i{font-style:normal;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--gold-hi);font-size:1.2rem;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:370px){.ln,.ln-h{grid-template-columns:minmax(0,1fr) 66px 84px}.hero .big{font-size:2rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <img src="logo.png" alt="Logo Antonia Carla, bolo e brownie">
    <div class="ttl"><h1>Brownie AC</h1><small id="subTitle">Resumo do mês</small></div>
    <div class="month">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <span id="mlabel"></span>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Seções">
  <div class="nav-in">
    <button data-tab="resumo" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
    <button data-tab="compras"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>Compras</button>
    <button class="plus" id="plus" aria-label="Novo lançamento"><span>+</span></button>
    <button data-tab="dist"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14.5c1.9.8 3 2.6 3 5.5"/></svg>Distribuidores</button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="bkFile" accept="application/json,.json" hidden>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(n,d=2)=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const parse=s=>{if(typeof s==='number')return s;s=String(s||'').replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?Math.round(n*1000)/1000:NaN};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtDay=s=>{const d=fromIso(s);return d.getDate()+' '+MESES[d.getMonth()]};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY='brownie-ac-v1';

const DEFAULTS={
  insumos:[
    {id:'chocolate',nome:'Chocolate',unidade:'kg',grupo:'materia'},
    {id:'manteiga',nome:'Manteiga',unidade:'kg',grupo:'materia'},
    {id:'acucar',nome:'Açúcar',unidade:'kg',grupo:'materia'},
    {id:'ovos',nome:'Ovos',unidade:'un',grupo:'materia'},
    {id:'farinha',nome:'Farinha',unidade:'kg',grupo:'materia'},
    {id:'nescau',nome:'Nescau',unidade:'kg',grupo:'materia'},
    {id:'embalagens',nome:'Embalagens',unidade:'un',grupo:'embalagem'},
    {id:'adesivo-logo',nome:'Adesivos logo',unidade:'un',grupo:'embalagem'},
    {id:'adesivo-validade',nome:'Adesivos de validade',unidade:'un',grupo:'embalagem'}],
  produtos:[
    {id:'brownie',nome:'Brownie',preco:0},
    {id:'bolo',nome:'Bolo',preco:0},
    {id:'sobremesa',nome:'Sobremesa',preco:0}],
  distribuidores:[],compras:[],saidas:[],backupEm:null};

function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.insumos)return Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),d)}catch(e){}return JSON.parse(JSON.stringify(DEFAULTS))}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste aparelho')}}
save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const today=new Date();
let cur=new Date(today.getFullYear(),today.getMonth(),1);
let tab='resumo';
const mKey=()=>cur.getFullYear()+'-'+pad(cur.getMonth()+1);
const inMonth=x=>x.data&&x.data.slice(0,7)===mKey();
const isCurMonth=()=>cur.getFullYear()===today.getFullYear()&&cur.getMonth()===today.getMonth();
const defDate=()=>isCurMonth()?iso(today):iso(cur);
const totCompra=c=>c.itens.reduce((a,i)=>a+(+i.valor||0),0);
const totSaida=s=>s.itens.reduce((a,i)=>a+(+i.qtd||0)*(+i.preco||0),0);
const unSaida=s=>s.itens.reduce((a,i)=>a+(+i.qtd||0),0);
const insumo=id=>S.insumos.find(i=>i.id===id)||{nome:'(removido)',unidade:''};
const produto=id=>S.produtos.find(p=>p.id===id)||{nome:'(removido)'};
const distr=id=>S.distribuidores.find(d=>d.id===id)||{nome:'(removido)'};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1900)}
function armDelete(btn,fn,label='Confirmar'){if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');const old=btn.textContent;btn.textContent=label;setTimeout(()=>{btn.classList.remove('armed');btn.textContent=old},3000)}

// ================= VIEWS =================
const SUB={resumo:'Resumo do mês',compras:'Compras de insumos',dist:'Distribuidores',ajustes:'Produtos, insumos e backup'};
function render(){
  $('#mlabel').textContent=MESES[cur.getMonth()]+' '+cur.getFullYear();
  $('#subTitle').textContent=SUB[tab];
  document.querySelectorAll('.nav [data-tab]').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  document.querySelector('.month').style.visibility=tab==='ajustes'?'hidden':'visible';
  $('#view').innerHTML=({resumo:vResumo,compras:vCompras,dist:vDist,ajustes:vAjustes})[tab]();
  bindView();
}

function vResumo(){
  const sa=S.saidas.filter(inMonth), co=S.compras.filter(inMonth);
  const vendido=sa.reduce((a,s)=>a+totSaida(s),0), gasto=co.reduce((a,c)=>a+totCompra(c),0);
  const res=vendido-gasto;
  const receberMes=sa.filter(s=>!s.pago).reduce((a,s)=>a+totSaida(s),0);
  const receberTotal=S.saidas.filter(s=>!s.pago).reduce((a,s)=>a+totSaida(s),0);
  const unid=sa.reduce((a,s)=>a+unSaida(s),0);
  // por produto
  const porProd={};sa.forEach(s=>s.itens.forEach(i=>{porProd[i.produtoId]=porProd[i.produtoId]||{q:0,v:0};porProd[i.produtoId].q+=+i.qtd||0;porProd[i.produtoId].v+=(+i.qtd||0)*(+i.preco||0)}));
  const pp=Object.entries(porProd).sort((a,b)=>b[1].v-a[1].v);const maxP=Math.max(1,...pp.map(x=>x[1].v));
  const porDist={};sa.forEach(s=>{porDist[s.distId]=(porDist[s.distId]||0)+totSaida(s)});
  const pd=Object.entries(porDist).sort((a,b)=>b[1]-a[1]);const maxD=Math.max(1,...pd.map(x=>x[1]));
  const mov=[...sa.map(s=>({t:'s',d:s.data,c:s.criado||0,o:s})),...co.map(c=>({t:'c',d:c.data,c:c.criado||0,o:c}))].sort((a,b)=>b.d.localeCompare(a.d)||b.c-a.c).slice(0,8);
  return `
  <section class="hero" aria-label="Resultado do mês">
    <div><div class="eyebrow">Vendido no mês</div><div class="big">${brl(vendido)}</div></div>
    <div class="kpis">
      <div class="kpi"><span>Gasto em compras</span><b>${brl(gasto)}</b></div>
      <div class="kpi"><span>Resultado</span><b class="${res>=0?'pos':'neg'}">${brl(res)}</b></div>
      <div class="kpi"><span>A receber (este mês)</span><b style="color:var(--warn)">${brl(receberMes)}</b></div>
      <div class="kpi"><span>Unidades vendidas</span><b>${num(unid,0)}</b></div>
    </div>
  </section>
  <div class="quick">
    <button class="btn gold" data-act="nova-saida">+ Saída para distribuidor</button>
    <button class="btn" data-act="nova-compra">+ Compra de insumos</button>
  </div>
  ${receberTotal>0?`<div class="card" style="border-color:#6a4a1c;background:var(--warn-soft)"><div class="card-h" style="margin:0"><span><b>Total a receber</b><br><span style="font-size:.8rem;color:var(--muted)">somando todos os meses</span></span><b style="font-size:1.2rem;color:var(--warn)">${brl(receberTotal)}</b></div></div>`:''}
  <section class="card"><div class="card-h"><h2 class="sec-title">Vendas por produto</h2><em>${MESES[cur.getMonth()]}</em></div>
    ${pp.length?`<div class="bars">${pp.map(([id,x])=>`<div class="bar-row"><span class="nm">${esc(produto(id).nome)} <span style="color:var(--muted);font-weight:600">· ${num(x.q,0)} un</span></span><span class="vl">${brl(x.v)}</span><span class="track"><i style="width:${(x.v/maxP*100).toFixed(1)}%"></i></span></div>`).join('')}</div>`:`<div class="empty">Nenhuma saída registrada neste mês. Toque em <b>+ Saída para distribuidor</b> para lançar a primeira.</div>`}
  </section>
  <section class="card"><div class="card-h"><h2 class="sec-title">Ranking de distribuidores</h2><em>vendido no mês</em></div>
    ${pd.length?`<div class="bars">${pd.map(([id,v])=>`<div class="bar-row"><span class="nm">${esc(distr(id).nome)}</span><span class="vl">${brl(v)}</span><span class="track"><i style="width:${(v/maxD*100).toFixed(1)}%"></i></span></div>`).join('')}</div>`:`<div class="empty">${S.distribuidores.length?'Sem vendas neste mês ainda.':'Cadastre seus distribuidores na aba <b>Distribuidores</b>.'}</div>`}
  </section>
  <section class="card"><div class="card-h"><h2 class="sec-title">Últimos lançamentos</h2></div>
    ${mov.length?`<div class="list">${mov.map(m=>m.t==='s'
      ?`<button class="row" data-saida="${m.o.id}"><span class="t">${esc(distr(m.o.distId).nome)}</span><span class="v">${brl(totSaida(m.o))}</span><span class="m">${fmtDay(m.d)} · ${num(unSaida(m.o),0)} un</span><span class="s"><span class="chip ${m.o.pago?'ok':'pend'}">${m.o.pago?'Pago':'A receber'}</span></span></button>`
      :`<button class="row" data-compra="${m.o.id}"><span class="t">Compra${m.o.local?' · '+esc(m.o.local):''}</span><span class="v" style="color:var(--bad)">− ${brl(totCompra(m.o))}</span><span class="m">${fmtDay(m.d)} · ${m.o.itens.length} ite${m.o.itens.length>1?'ns':'m'}</span><span class="s"><span class="chip buy">Compra</span></span></button>`).join('')}</div>`:'<div class="empty">Nada lançado neste mês.</div>'}
  </section>`;
}

function vCompras(){
  const co=S.compras.filter(inMonth).sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0));
  const total=co.reduce((a,c)=>a+totCompra(c),0);
  const agg={};co.forEach(c=>c.itens.forEach(i=>{agg[i.insumoId]=agg[i.insumoId]||{q:0,v:0};agg[i.insumoId].q+=+i.qtd||0;agg[i.insumoId].v+=+i.valor||0}));
  const rows=S.insumos.filter(i=>agg[i.id]).map(i=>[i,agg[i.id]]);
  Object.keys(agg).forEach(id=>{if(!S.insumos.find(i=>i.id===id))rows.push([insumo(id),agg[id]])});
  const sub=g=>rows.filter(([i])=>(i.grupo||'materia')===g).reduce((a,[,x])=>a+x.v,0);
  return `
  <section class="hero"><div><div class="eyebrow">Gasto em compras no mês</div><div class="big">${brl(total)}</div></div>
    <div class="kpis"><div class="kpi"><span>Matéria-prima</span><b>${brl(sub('materia'))}</b></div><div class="kpi"><span>Embalagens e adesivos</span><b>${brl(sub('embalagem'))}</b></div></div>
  </section>
  <button class="btn gold" data-act="nova-compra">+ Registrar compra</button>
  <section class="card"><div class="card-h"><h2 class="sec-title">Por insumo</h2><em>quantidade e preço médio</em></div>
    ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Insumo</th><th>Qtd</th><th>Gasto</th><th>Médio</th></tr></thead><tbody>
    ${rows.map(([i,x])=>`<tr><td>${esc(i.nome)}</td><td>${num(x.q)} ${esc(i.unidade)}</td><td>${brl(x.v)}</td><td>${x.q>0?brl(x.v/x.q)+'/'+esc(i.unidade):'—'}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td></td><td>${brl(total)}</td><td></td></tr></tfoot></table></div>`:'<div class="empty">Nenhuma compra neste mês. Toque em <b>+ Registrar compra</b> e preencha só o que comprou.</div>'}
  </section>
  <section class="card"><div class="card-h"><h2 class="sec-title">Compras do mês</h2><em>${co.length} registro${co.length===1?'':'s'}</em></div>
    ${co.length?`<div class="list">${co.map(c=>`<button class="row" data-compra="${c.id}"><span class="t">${fmtDay(c.data)}${c.local?' · '+esc(c.local):''}</span><span class="v">${brl(totCompra(c))}</span><span class="m">${esc(c.itens.map(i=>insumo(i.insumoId).nome+' '+num(i.qtd)+' '+insumo(i.insumoId).unidade).join(', '))}</span><span></span></button>`).join('')}</div>`:'<div class="empty">Sem compras registradas.</div>'}
  </section>`;
}

function distStats(d){
  const all=S.saidas.filter(s=>s.distId===d.id);
  const mes=all.filter(inMonth);
  return{all,mes,vendMes:mes.reduce((a,s)=>a+totSaida(s),0),unMes:mes.reduce((a,s)=>a+unSaida(s),0),receber:all.filter(s=>!s.pago).reduce((a,s)=>a+totSaida(s),0),vendTotal:all.reduce((a,s)=>a+totSaida(s),0)};
}
function vDist(){
  const ds=[...S.distribuidores].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  return `
  <div class="btns"><button class="btn gold" data-act="nova-saida">+ Registrar saída</button><button class="btn" data-act="novo-dist">+ Novo distribuidor</button></div>
  <section>
    ${ds.length?ds.map(d=>{const st=distStats(d);return `<button class="dist" data-dist="${d.id}"><span class="ava">${esc(initials(d.nome))}</span><span style="min-width:0"><span class="t">${esc(d.nome)}</span><span class="m" style="display:block">${num(st.unMes,0)} un em ${MESES[cur.getMonth()]}${d.regiao?' · '+esc(d.regiao):''}</span></span><span class="v">${brl(st.vendMes)}<small style="color:${st.receber>0?'var(--warn)':'var(--good)'}">${st.receber>0?'a receber '+brl(st.receber):'tudo pago'}</small></span></button>`}).join('')
    :`<div class="card"><div class="empty">Você ainda não cadastrou distribuidores. Toque em <b>+ Novo distribuidor</b> para criar o primeiro com nome e telefone.</div></div>`}

  <section class="card"><div class="card-h"><h2 class="sec-title">Produtos e preço padrão</h2><em>usado nas saídas</em></div>

    <button class="btn ghost" data-act="add-ins" data-grupo="${g}" style="margin-top:8px">+ Adicionar em ${g==='materia'?'matéria-prima':'embalagens'}</button>`).join('')}

    <p class="hint" style="margin:0 0 10px">Tudo fica salvo neste celular. Salve um backup de vez em quando (dá para mandar no WhatsApp ou Drive) para não perder nada se trocar de aparelho.</p>

function bindView(){
  const v=$('#view');
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>ACT[b.dataset.act](b));
  v.querySelectorAll('[data-compra]').forEach(b=>b.onclick=()=>sheetCompra(S.compras.find(c=>c.id===b.dataset.compra)));
  v.querySelectorAll('[data-saida]').forEach(b=>b.onclick=()=>sheetSaida(S.saidas.find(s=>s.id===b.dataset.saida)));
  v.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>sheetDistDetalhe(b.dataset.dist));
  // ajustes
  v.querySelectorAll('[data-prod]').forEach(r=>{const id=r.dataset.prod,p=S.produtos.find(x=>x.id===id);
    r.querySelector('#pn-'+id).onchange=e=>{p.nome=e.target.value.trim()||p.nome;save()};
    r.querySelector('#pp-'+id).onchange=e=>{const n=parse(e.target.value);if(isNaN(n)){e.target.value=p.preco?num(p.preco):'';return}p.preco=n;e.target.value=n?num(n):'';save();toast('Preço salvo')}});
  v.querySelectorAll('[data-delprod]').forEach(b=>b.onclick=()=>armDelete(b,()=>{S.produtos=S.produtos.filter(p=>p.id!==b.dataset.delprod);save();render()},'?'));
  v.querySelectorAll('[data-ins]').forEach(r=>{const id=r.dataset.ins,i=S.insumos.find(x=>x.id===id);
    r.querySelector('#in-'+id).onchange=e=>{i.nome=e.target.value.trim()||i.nome;save()};
    r.querySelector('#iu-'+id).onchange=e=>{i.unidade=e.target.value;save()}});
  v.querySelectorAll('[data-delins]').forEach(b=>b.onclick=()=>armDelete(b,()=>{S.insumos=S.insumos.filter(i=>i.id!==b.dataset.delins);save();render()},'?'));
}

const ACT={
  'nova-compra':()=>sheetCompra(null),
  'nova-saida':()=>sheetSaida(null),
  'novo-dist':()=>sheetDist(null),
  'add-prod':()=>{S.produtos.push({id:uid('p'),nome:'Novo produto',preco:0});save();render();const ins=document.querySelectorAll('#prodList input[aria-label="Nome do produto"]');const el=ins[ins.length-1];el&&(el.focus(),el.select())},
  'add-ins':b=>{S.insumos.push({id:uid('i'),nome:'Novo insumo',unidade:'un',grupo:b.dataset.grupo});save();render()},
  'bk-export':async()=>{
    S.backupEm=Date.now();save();
    const name='backup-brownie-ac-'+iso(new Date())+'.json';
    const file=new File([JSON.stringify(S)],name,{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Brownie AC'});render();return}}catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);render();toast('Backup salvo')},
  'bk-import':()=>$('#bkFile').click()
};
$('#bkFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.insumos)||!Array.isArray(d.saidas))throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),d);save();render();toast('Backup restaurado')}
  catch(err){toast('Arquivo inválido. Escolha um backup do Brownie AC.')}};

// ================= SHEETS =================
function openSheet(html,onReady){const sh=$('#sheet');sh.innerHTML='<div class="grab"></div>'+html;$('#sheetBg').hidden=false;sh.scrollTop=0;onReady&&onReady(sh)}
function closeSheet(){$('#sheetBg').hidden=true;$('#sheet').innerHTML=''}
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetBg').hidden)closeSheet()});

function sheetEscolha(){
  openSheet(`<h2>O que você quer lançar?</h2><div class="choose">
    <button id="chS"><i>➜</i><span><b>Saída para distribuidor</b><small>Brownies, bolos e sobremesas entregues</small></span></button>
    <button id="chC"><i>＋</i><span><b>Compra de insumos</b><small>Chocolate, manteiga, embalagens…</small></span></button>
    <button id="chD"><i>☺</i><span><b>Novo distribuidor</b><small>Cadastrar nome e telefone</small></span></button></div>`,sh=>{
    sh.querySelector('#chS').onclick=()=>sheetSaida(null);sh.querySelector('#chC').onclick=()=>sheetCompra(null);sh.querySelector('#chD').onclick=()=>sheetDist(null)});
}

function sheetCompra(c){
  const map={};(c?c.itens:[]).forEach(i=>map[i.insumoId]=i);
  const line=i=>{const it=map[i.id];return `<div class="ln${it?' on':''}" data-id="${i.id}"><span class="nm">${esc(i.nome)}<small>${esc(i.unidade)}</small></span><input type="text" id="cq-${i.id}" inputmode="decimal" placeholder="0" value="${it?num(it.qtd,3):''}" aria-label="Quantidade de ${esc(i.nome)}"><input type="text" id="cv-${i.id}" inputmode="decimal" placeholder="R$ 0,00" value="${it?num(it.valor):''}" aria-label="Valor pago em ${esc(i.nome)}"></div>`};
  openSheet(`<h2>${c?'Editar compra':'Nova compra'}</h2>
    <div class="two"><div class="field"><label for="cData">Data</label><input type="date" id="cData" value="${c?c.data:defDate()}"></div>
    <div class="field"><label for="cLocal">Onde comprou</label><input type="text" id="cLocal" placeholder="Ex.: Atacadão" value="${esc(c?.local||'')}"></div></div>
    <div class="ln-h"><span style="text-align:left">Item</span><span>Qtd</span><span>Valor total</span></div>
    <div class="lines">
      ${S.insumos.filter(i=>(i.grupo||'materia')==='materia').map(line).join('')}
      <div class="grp">Embalagens e adesivos</div>
      ${S.insumos.filter(i=>i.grupo==='embalagem').map(line).join('')}
    </div>
    <div class="total"><span class="lbl">Total da compra</span><b id="cTot">R$ 0,00</b></div>
    <div class="err" id="cErr" hidden></div>
    <div class="btns">${c?'<button class="btn danger" id="cDel" style="flex:0 0 auto">Excluir</button>':''}<button class="btn" id="cCancel">Cancelar</button><button class="btn gold" id="cSave">Salvar compra</button></div>`,sh=>{
    const recalc=()=>{let t=0;sh.querySelectorAll('.ln').forEach(r=>{const id=r.dataset.id;const q=parse(sh.querySelector('#cq-'+id).value),v=parse(sh.querySelector('#cv-'+id).value);t+=isNaN(v)?0:v;r.classList.toggle('on',(q>0)||(v>0))});sh.querySelector('#cTot').textContent=brl(t)};
    sh.querySelectorAll('.ln input').forEach(i=>i.addEventListener('input',recalc));recalc();
    sh.querySelector('#cCancel').onclick=closeSheet;
    if(c)sh.querySelector('#cDel').onclick=e=>armDelete(e.target,()=>{S.compras=S.compras.filter(x=>x.id!==c.id);save();closeSheet();render();toast('Compra excluída')});
    sh.querySelector('#cSave').onclick=()=>{
      const itens=[];let bad=false;
      sh.querySelectorAll('.ln').forEach(r=>{const id=r.dataset.id;const q=parse(sh.querySelector('#cq-'+id).value),v=parse(sh.querySelector('#cv-'+id).value);
        if(isNaN(q)||isNaN(v)){bad=true;return}if(q>0||v>0)itens.push({insumoId:id,qtd:q||0,valor:v||0})});
      const err=sh.querySelector('#cErr');const data=sh.querySelector('#cData').value;
      if(bad){err.textContent='Algum número está estranho. Use só números, por exemplo 2 ou 35,90.';err.hidden=false;return}
      if(!itens.length){err.textContent='Preencha a quantidade ou o valor de pelo menos um item.';err.hidden=false;return}
      if(!data){err.textContent='Escolha a data da compra.';err.hidden=false;return}
      const body={data,local:sh.querySelector('#cLocal').value.trim(),itens,criado:c?.criado||Date.now()};
      if(c)Object.assign(c,body);else S.compras.push({id:uid('c'),...body});
      save();closeSheet();if(data.slice(0,7)!==mKey())cur=fromIso(data.slice(0,7)+'-01');render();toast(c?'Compra atualizada':'Compra salva')};
  });
}

function sheetSaida(s,presetDist){
  if(!S.distribuidores.length&&!s){sheetDist(null,true);toast('Cadastre um distribuidor primeiro');return}
  const map={};(s?s.itens:[]).forEach(i=>map[i.produtoId]=i);
  const prods=[...S.produtos];(s?s.itens:[]).forEach(i=>{if(!prods.find(p=>p.id===i.produtoId))prods.push({id:i.produtoId,nome:produto(i.produtoId).nome,preco:i.preco})});
  let pago=s?!!s.pago:false;
  const sel=s?s.distId:(presetDist||(S.distribuidores.length===1?S.distribuidores[0].id:''));
  openSheet(`<h2>${s?'Editar saída':'Saída para distribuidor'}</h2>
    <div class="field"><label for="sDist">Distribuidor</label><select id="sDist"><option value="">Escolha…</option>${[...S.distribuidores].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${esc(d.nome)}</option>`).join('')}</select></div>

    <div class="ln-h"><span style="text-align:left">Produto</span><span>Qtd</span><span>Preço un.</span></div>
    <div class="lines">${prods.map(p=>{const it=map[p.id];return `<div class="ln${it?' on':''}" data-id="${p.id}"><span class="nm">${esc(p.nome)}<small id="st-${p.id}">—</small></span><input type="text" id="sq-${p.id}" inputmode="numeric" placeholder="0" value="${it?num(it.qtd,0):''}" aria-label="Quantidade de ${esc(p.nome)}"><input type="text" id="sp-${p.id}" inputmode="decimal" placeholder="R$ 0,00" value="${it?num(it.preco):(p.preco?num(p.preco):'')}" aria-label="Preço unitário de ${esc(p.nome)}"></div>`}).join('')}</div>
    <div class="total"><span class="lbl">Total da saída</span><b id="sTot">R$ 0,00</b></div>
    <div class="field"><span class="lbl">Pagamento</span><div class="seg" id="sPago"><button type="button" data-v="0">A receber</button><button type="button" data-v="1">Já pago</button></div></div>
    <div class="field"><label for="sObs">Observação</label><input type="text" id="sObs" placeholder="Opcional" value="${esc(s?.obs||'')}"></div>
    <div class="err" id="sErr" hidden></div>
    <div class="btns">${s?'<button class="btn danger" id="sDel" style="flex:0 0 auto">Excluir</button>':''}<button class="btn" id="sCancel">Cancelar</button><button class="btn gold" id="sSave">Salvar saída</button></div>`,sh=>{
    const setPago=v=>{pago=v;sh.querySelectorAll('#sPago button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.v==='1')===v))};setPago(pago);
    sh.querySelectorAll('#sPago button').forEach(b=>b.onclick=()=>setPago(b.dataset.v==='1'));
    const recalc=()=>{let t=0;sh.querySelectorAll('.ln').forEach(r=>{const id=r.dataset.id;const q=parse(sh.querySelector('#sq-'+id).value),p=parse(sh.querySelector('#sp-'+id).value);const sub=(q>0&&p>0)?q*p:0;t+=sub;sh.querySelector('#st-'+id).textContent=q>0?(p>0?brl(sub):'sem preço'):'—';r.classList.toggle('on',q>0)});sh.querySelector('#sTot').textContent=brl(t)};
    sh.querySelectorAll('.ln input').forEach(i=>i.addEventListener('input',recalc));recalc();
    sh.querySelector('#sCancel').onclick=closeSheet;
    if(s)sh.querySelector('#sDel').onclick=e=>armDelete(e.target,()=>{S.saidas=S.saidas.filter(x=>x.id!==s.id);save();closeSheet();render();toast('Saída excluída')});
    sh.querySelector('#sSave').onclick=()=>{
      const err=sh.querySelector('#sErr');const distId=sh.querySelector('#sDist').value,data=sh.querySelector('#sData').value;
      const itens=[];let bad=false;
      sh.querySelectorAll('.ln').forEach(r=>{const id=r.dataset.id;const q=parse(sh.querySelector('#sq-'+id).value),p=parse(sh.querySelector('#sp-'+id).value);if(isNaN(q)||isNaN(p)){bad=true;return}if(q>0)itens.push({produtoId:id,qtd:q,preco:p||0})});
      if(!distId){err.textContent='Escolha o distribuidor.';err.hidden=false;return}
      if(bad){err.textContent='Algum número está estranho. Use só números, por exemplo 12 ou 8,50.';err.hidden=false;return}
      if(!itens.length){err.textContent='Coloque a quantidade de pelo menos um produto.';err.hidden=false;return}
      if(!data){err.textContent='Escolha a data da entrega.';err.hidden=false;return}
      const body={distId,data,itens,pago,obs:sh.querySelector('#sObs').value.trim(),criado:s?.criado||Date.now()};
      if(s)Object.assign(s,body);else S.saidas.push({id:uid('s'),...body});
      save();closeSheet();if(data.slice(0,7)!==mKey())cur=fromIso(data.slice(0,7)+'-01');render();toast(s?'Saída atualizada':'Saída salva')};
  });
}

function sheetDist(d,thenSaida){
  openSheet(`<h2>${d?'Editar distribuidor':'Novo distribuidor'}</h2>
    <div class="field"><label for="dNome">Nome</label><input type="text" id="dNome" placeholder="Ex.: Mercadinho do Zé" value="${esc(d?.nome||'')}"></div>
    <div class="two"><div class="field"><label for="dTel">Telefone</label><input type="tel" id="dTel" placeholder="(84) 9…" value="${esc(d?.tel||'')}"></div>
    <div class="field"><label for="dReg">Bairro / região</label><input type="text" id="dReg" placeholder="Opcional" value="${esc(d?.regiao||'')}"></div></div>
    <div class="err" id="dErr" hidden></div>
    <div class="btns">${d?'<button class="btn danger" id="dDel" style="flex:0 0 auto">Excluir</button>':''}<button class="btn" id="dCancel">Cancelar</button><button class="btn gold" id="dSave">Salvar</button></div>
    ${d?'<p class="hint">Excluir o distribuidor também apaga as saídas dele.</p>':''}`,sh=>{
    setTimeout(()=>sh.querySelector('#dNome').focus(),60);
    sh.querySelector('#dCancel').onclick=()=>d?sheetDistDetalhe(d.id):closeSheet();
    if(d)sh.querySelector('#dDel').onclick=e=>armDelete(e.target,()=>{S.distribuidores=S.distribuidores.filter(x=>x.id!==d.id);S.saidas=S.saidas.filter(s=>s.distId!==d.id);save();closeSheet();render();toast('Distribuidor excluído')});
    sh.querySelector('#dSave').onclick=()=>{const nome=sh.querySelector('#dNome').value.trim();
      if(!nome){const e=sh.querySelector('#dErr');e.textContent='Digite o nome do distribuidor.';e.hidden=false;return}
      const body={nome,tel:sh.querySelector('#dTel').value.trim(),regiao:sh.querySelector('#dReg').value.trim()};
      let id;if(d){Object.assign(d,body);id=d.id}else{id=uid('d');S.distribuidores.push({id,...body,criado:Date.now()})}
      save();render();toast(d?'Distribuidor atualizado':'Distribuidor criado');
      if(thenSaida)sheetSaida(null,id);else sheetDistDetalhe(id)};
  });
}

function sheetDistDetalhe(id){
  const d=S.distribuidores.find(x=>x.id===id);if(!d){closeSheet();return}
  const st=distStats(d);
  const hist=[...st.all].sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0)).slice(0,40);
  openSheet(`<div style="display:flex;gap:12px;align-items:center"><span class="ava">${esc(initials(d.nome))}</span><div style="min-width:0;flex:1"><h2>${esc(d.nome)}</h2><div style="font-size:.82rem;color:var(--muted)">${[d.tel,d.regiao].filter(Boolean).map(esc).join(' · ')||'Sem telefone cadastrado'}</div></div></div>
    <div class="stats3"><div><span>Vendido em ${MESES[cur.getMonth()]}</span><b>${brl(st.vendMes)}</b></div><div><span>Unidades no mês</span><b>${num(st.unMes,0)}</b></div><div><span>A receber</span><b style="color:${st.receber>0?'var(--warn)':'var(--good)'}">${brl(st.receber)}</b></div></div>
    <div class="btns"><button class="btn gold" id="ddSaida">+ Nova saída</button>${st.receber>0?'<button class="btn" id="ddReceber">Receber tudo</button>':''}<button class="btn" id="ddEdit">Editar</button></div>
    <div><div class="lbl" style="margin-bottom:4px">Histórico de saídas · total ${brl(st.vendTotal)}</div>
    ${hist.length?`<div class="list">${hist.map(s=>`<div class="row"><button style="all:unset;cursor:pointer;min-width:0" data-ed="${s.id}"><span class="t" style="display:block">${fmtDay(s.data)} · ${brl(totSaida(s))}</span><span class="m" style="display:block">${esc(s.itens.map(i=>num(i.qtd,0)+' '+produto(i.produtoId).nome).join(', '))}${s.obs?' · '+esc(s.obs):''}</span></button><span class="s" style="align-self:center"><button class="chip ${s.pago?'ok':'pend'}" data-tg="${s.id}" aria-label="Alternar pagamento">${s.pago?'Pago':'A receber'}</button></span></div>`).join('')}</div>`:'<div class="empty">Nenhuma saída para este distribuidor ainda.</div>'}</div>
    <p class="hint">Toque em "A receber" para marcar como pago. Toque na saída para editar.</p>`,sh=>{
    sh.querySelector('#ddSaida').onclick=()=>sheetSaida(null,d.id);
    sh.querySelector('#ddEdit').onclick=()=>sheetDist(d);
    const rec=sh.querySelector('#ddReceber');if(rec)rec.onclick=()=>armDelete(rec,()=>{S.saidas.forEach(s=>{if(s.distId===d.id)s.pago=true});save();render();sheetDistDetalhe(d.id);toast('Tudo marcado como pago')},'Confirmar '+brl(st.receber));
    sh.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const s=S.saidas.find(x=>x.id===b.dataset.tg);s.pago=!s.pago;save();render();sheetDistDetalhe(d.id)});
    sh.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>sheetSaida(S.saidas.find(x=>x.id===b.dataset.ed)));
  });
}

// ================= NAV =================
document.querySelectorAll('.nav [data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav [data-tab]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');render();window.scrollTo(0,0)});
$('#plus').onclick=()=>{if(tab==='compras')sheetCompra(null);else if(tab==='dist')sheetSaida(null);else sheetEscolha()};
$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
render();

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
